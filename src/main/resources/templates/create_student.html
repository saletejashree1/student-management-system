<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | Student Management'">Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 760px;">
    <div class="mb-4">
        <a th:href="@{/students}" class="text-decoration-none">&larr; Back to students</a>
        <h1 class="h2 mt-3" th:text="${pageTitle}">Add Student</h1>
        <p class="text-secondary">Enter the student's details below.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="${formAction}" th:object="${student}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="name" class="form-label">Full name</label>
                    <input id="name" type="text" class="form-control" th:field="*{name}"
                           placeholder="Enter full name" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" type="email" class="form-control" th:field="*{email}"
                           placeholder="student@example.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-4">
                    <label for="course" class="form-label">Course</label>
                    <input id="course" type="text" class="form-control" th:field="*{course}"
                           placeholder="e.g. Java Full Stack" th:classappend="${#fields.hasErrors('course')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save Student</button>
                    <a class="btn btn-outline-secondary" th:href="@{/students}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
